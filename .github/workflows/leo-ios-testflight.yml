name: Leo iOS TestFlight

# Archive the Release build and upload it to TestFlight. Run it by hand
# (Actions → Run workflow) or push a leo-ios-vX.Y.Z tag. Setup: ios/README.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "leo-ios-v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: leo-ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode-26.5.0.app/Contents/Developer
  TEAM_ID: 52M9C6892K

jobs:
  testflight:
    runs-on: [self-hosted, macOS, leo]
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set paths
        run: |
          echo "ARCHIVE=$RUNNER_TEMP/Leo.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_DIR=$RUNNER_TEMP/leo-export" >> "$GITHUB_ENV"

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name (see ios/README.md)"
              exit 1
            fi
          done

      # The key lives only in $RUNNER_TEMP for the job; xcodebuild reads it
      # by path for both the archive and the upload.
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: ios
        run: |
          rm -rf "$ARCHIVE"
          xcodebuild archive \
            -project Leo.xcodeproj -scheme Leo -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # destination=upload sends the build straight to App Store Connect.
      - name: Export and upload to TestFlight
        working-directory: ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up
        if: always()
        run: rm -rf "$ARCHIVE" "$EXPORT_DIR" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/ExportOptions.plist"
