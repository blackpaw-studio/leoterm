name: Leo Relay CI

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/leo-relay.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/leo-relay.yml"
  workflow_dispatch:

concurrency:
  group: leo-relay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Install
        working-directory: relay
        run: npm ci
      - name: Test
        working-directory: relay
        run: npm test
      - name: Typecheck
        working-directory: relay
        run: npx tsc --noEmit
