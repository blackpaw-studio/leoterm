name: Leo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: leo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode-26.3.0.app/Contents/Developer

jobs:
  test-macos:
    # Never run fork PRs on the self-hosted runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, leo]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      # Every .github/scripts/leo/tests/test_*.sh (CI/release script tests);
      # fast, so it runs first and fails the job on any failure.
      - name: CI script tests
        run: .github/scripts/leo/run-tests.sh

      - name: SwiftLint
        working-directory: macos
        run: swiftlint lint --strict

      - name: Build GhosttyKit
        run: |
          rm -rf macos/GhosttyKit.xcframework zig-out
          zig build -Demit-macos-app=false

      - name: Unit tests
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData-ci
          LOG: ${{ runner.temp }}/leo-tests.log
        run: .github/scripts/leo/run-unit-tests.sh

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leo-test-log
          retention-days: 14
          path: ${{ runner.temp }}/leo-tests.log
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        env:
          TEMP_DIR: ${{ runner.temp }}
        run: rm -rf "$TEMP_DIR/DerivedData-ci" "$TEMP_DIR/leo-tests.log" zig-out macos/GhosttyKit.xcframework
