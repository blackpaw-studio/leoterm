name: Leo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_self_hosted:
        description: Let test-macos use the self-hosted Tart runner when it is idle
        type: boolean
        default: true
  workflow_call:
    inputs:
      allow_self_hosted:
        description: Let test-macos use the self-hosted Tart runner when it is idle
        type: boolean
        default: true

# github.workflow is the caller's name inside a reusable call, so a release
# run ("Leo Release") can't share a group with, and cancel, push CI ("Leo CI")
# on the same ref.
concurrency:
  group: leo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Bump to start every cache cold.
env:
  CACHE_SALT: v5

jobs:
  # Cheap and independent of test-macos. The committed bundle is what Xcode
  # ships (no Node there), so fail if a rebuild differs from it.
  plugin-github:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/github
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: plugins/github/.nvmrc
          cache: npm
          cache-dependency-path: plugins/github/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Committed bundle is up to date
        working-directory: .
        run: git diff --exit-code -- macos/Bundled/Plugins/studio.blackpaw.github

  plugin-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/status
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: plugins/status/.nvmrc
          cache: npm
          cache-dependency-path: plugins/status/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Committed bundle is up to date
        working-directory: .
        run: git diff --exit-code -- macos/Bundled/Plugins/studio.blackpaw.status

  # Chooses where test-macos runs: Evan's self-hosted Tart VM when it is idle,
  # else hosted macos-26. Every failure path falls back to hosted. See
  # docs/leo/ci-self-hosted.md.
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.LEO_RUNNER_PICKER_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          ALLOW: ${{ inputs.allow_self_hosted }}
        run: |
          hosted() {
            echo "::notice::test-macos runs on hosted macos-26: $1"
            echo 'runner="macos-26"' >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Fork PRs never get the self-hosted runner. The runner group
          # (leoterm only) and fork-approval rules are the real boundary; see
          # docs/leo/ci-self-hosted.md.
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REPO" != "$THIS_REPO" ]]; then
            hosted "fork pull request"
          fi
          [[ "$ALLOW" != false ]] || hosted "self-hosted disabled by allow_self_hosted=false"
          [[ -n "$GH_TOKEN" ]] || hosted "LEO_RUNNER_PICKER_TOKEN is not available"
          if ! runners="$(gh api --paginate /orgs/blackpaw-studio/actions/runners 2>&1)"; then
            hosted "runner API call failed (${runners//$'\n'/ })"
          fi
          idle="$(jq -s '[.[].runners[]
            | select(.status == "online" and .busy == false)
            | select(([.labels[].name] | index("self-hosted")) != null
                     and ([.labels[].name] | index("xcode-26.3")) != null)] | length' <<<"$runners")" \
            || hosted "could not parse runner list"
          (( idle > 0 )) || hosted "no idle online self-hosted runner with label xcode-26.3"
          echo "::notice::test-macos runs on self-hosted ($idle idle runner(s))"
          echo 'runner=["self-hosted","xcode-26.3"]' >> "$GITHUB_OUTPUT"

  test-macos:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    # A sleeping laptop shows up only here: a job queued on an offline
    # self-hosted runner waits until this timeout, then fails.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set DerivedData path
        run: echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData-ci" >> "$GITHUB_ENV"

      # Hard pin: Xcode 26.5's SDK breaks Zig linking (docs/leo/ci.md), so a
      # missing 26.3 must fail, never fall back to a newer Xcode.
      - name: Select Xcode 26.3
        env:
          IS_HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [[ "$IS_HOSTED" == true ]]; then
            candidates=(/Applications/Xcode_26.3.app)
          else
            candidates=(/Applications/Xcode_26.3.app /Applications/Xcode-26.3.0.app /Applications/Xcode-26.3.app /Applications/Xcode.app)
          fi
          for x in "${candidates[@]}"; do
            [[ -d "$x" ]] || continue
            v="$(DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version 2>/dev/null | sed -n 's/^Xcode //p')"
            [[ "$v" == 26.3* ]] || { echo "skipping $x (Xcode ${v:-unknown})"; continue; }
            echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"
            DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version
            exit 0
          done
          echo "::error::no Xcode 26.3 found among: ${candidates[*]}"
          ls -d /Applications/Xcode*.app || true
          exit 1

      - name: Setup zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false # zig caches managed explicitly below

      # run-unit-tests.sh calls GNU `timeout`, which hosted images lack.
      - name: Install coreutils (timeout)
        run: |
          # Idempotent: a reused self-hosted runner already has it.
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          # Only `timeout`: full gnubin shadows BSD stat/etc. and breaks script tests.
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/bin/timeout"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # sparkle-key-check.sh needs Ed25519 in `openssl pkey`. Hosted images put
      # Homebrew OpenSSL 3 first on PATH; a self-hosted VM may only have
      # macOS LibreSSL, which fails silently. No-op when OpenSSL 3 is first.
      - name: Ensure OpenSSL 3 on PATH
        run: |
          if openssl version | grep -q '^OpenSSL 3'; then exit 0; fi
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      # Not preinstalled; brew now ships 0.65.1 which adds a rule our code
      # trips (legacy_swiftui_aspect_ratio), so pin the version the dev box has.
      - name: Install swiftlint 0.63.3
        run: |
          mkdir -p "$RUNNER_TEMP/swiftlint"
          gh release download 0.63.3 -R realm/SwiftLint -p portable_swiftlint.zip -D "$RUNNER_TEMP/swiftlint"
          unzip -q -o "$RUNNER_TEMP/swiftlint/portable_swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache zig
        id: cache-zig
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ env.CACHE_SALT }}-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig', 'src/build/**', 'pkg/**/*.zig', 'pkg/**/build.zig.zon') }}
          restore-keys: zig-${{ env.CACHE_SALT }}-${{ runner.os }}-

      - name: Cache LeoKit .build
        id: cache-leokit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/LeoKit/.build
          key: leokit-${{ env.CACHE_SALT }}-${{ runner.os }}-${{ hashFiles('Packages/LeoKit/Package.swift', 'Packages/LeoKit/Sources/**', 'Packages/LeoKit/Tests/**') }}
          restore-keys: leokit-${{ env.CACHE_SALT }}-${{ runner.os }}-

      - name: Cache DerivedData (incl. SourcePackages)
        id: cache-dd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DERIVED_DATA }}
          key: dd-${{ env.CACHE_SALT }}-${{ runner.os }}-${{ hashFiles('macos/Ghostty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            dd-${{ env.CACHE_SALT }}-${{ runner.os }}-${{ hashFiles('macos/Ghostty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            dd-${{ env.CACHE_SALT }}-${{ runner.os }}-

      - name: CI script tests
        run: .github/scripts/leo/run-tests.sh

      - name: LeoKit tests
        working-directory: Packages/LeoKit
        run: |
          swiftlint lint --strict
          swift test

      - name: SwiftLint
        working-directory: macos
        run: swiftlint lint --strict

      # leo-release.yml calls this workflow on a leo-vX.Y.Z tag; without an
      # explicit version string Config.zig panics on the tag (B-317).
      - name: Build GhosttyKit
        run: |
          version="$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon | head -1)"
          [[ -n "$version" ]] || { echo "could not read .version from build.zig.zon" >&2; exit 1; }
          rm -rf macos/GhosttyKit.xcframework zig-out
          zig build -Demit-macos-app=false -Dversion-string="$version"

      - name: Unit tests
        env:
          LOG: ${{ runner.temp }}/leo-tests.log
        run: .github/scripts/leo/run-unit-tests.sh

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leo-test-log
          retention-days: 14
          path: |
            ${{ runner.temp }}/leo-tests.log
            ${{ runner.temp }}/leo-tests.log.hang
          if-no-files-found: ignore

      # Only main pushes write caches; PRs and tag calls restore from main.
      - name: Save zig cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-zig.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: ${{ steps.cache-zig.outputs.cache-primary-key }}

      - name: Save LeoKit .build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-leokit.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/LeoKit/.build
          key: ${{ steps.cache-leokit.outputs.cache-primary-key }}

      - name: Save DerivedData
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-dd.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ${{ steps.cache-dd.outputs.cache-primary-key }}
