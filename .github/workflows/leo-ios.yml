name: Leo iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "Packages/LeoKit/**"
      - "images/Ghostty.icon/**"
      - ".github/workflows/leo-ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "Packages/LeoKit/**"
      - "images/Ghostty.icon/**"
      - ".github/workflows/leo-ios.yml"
  workflow_dispatch:

concurrency:
  group: leo-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Xcode 27 crashes on this code; the Mac app's Xcode 26.3 pin is separate.
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  leo-ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIMULATOR: iPhone 17 Pro
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set paths
        run: |
          echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData-leo-ios" >> "$GITHUB_ENV"

      - name: Select Xcode 26.5
        run: |
          test -d "$DEVELOPER_DIR" || { echo "::error::$DEVELOPER_DIR missing on this macos-26 image"; ls -d /Applications/Xcode*.app; exit 1; }
          xcodebuild -version

      - name: Install xcodegen 2.42.0
        run: |
          mkdir -p "$RUNNER_TEMP/xcodegen"
          gh release download 2.42.0 -R yonaskolb/XcodeGen -p xcodegen.zip -D "$RUNNER_TEMP/xcodegen"
          unzip -q -o "$RUNNER_TEMP/xcodegen/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check simulator exists
        run: |
          xcrun simctl list devices available
          xcrun simctl list devices available | grep -q "${SIMULATOR} (" || { echo "::error::Simulator '${SIMULATOR}' not available"; exit 1; }

      - name: LeoKit tests
        working-directory: Packages/LeoKit
        run: swift test

      - name: LeoFeatures tests
        working-directory: ios/LeoFeatures
        run: swift test

      # The generated project is committed; any drift means someone edited
      # project.yml (or the project) without regenerating.
      - name: XcodeGen project is up to date
        working-directory: ios
        run: |
          xcodegen generate
          if ! git diff --exit-code -- Leo.xcodeproj; then
            echo "::error::ios/Leo.xcodeproj differs from 'cd ios && xcodegen generate'. Regenerate and commit."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- Leo.xcodeproj)
          if [ -n "$untracked" ]; then
            echo "::error::XcodeGen produced uncommitted files: $untracked"
            exit 1
          fi

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild build-for-testing \
            -project Leo.xcodeproj -scheme Leo \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: App tests
        working-directory: ios
        run: |
          # Flaky on hosted simulator (menu never opens / composer-focus wait
          # times out in every paste test, so the whole LeoChatPasteTests class
          # is skipped), disabled 2026-11-02; re-enable after fixing at cause.
          xcodebuild test-without-building \
            -project Leo.xcodeproj -scheme Leo \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -skip-testing:LeoUITests/LeoMachinesTests/testLiveTerminalModeMenuChangesFromSettings \
            -skip-testing:LeoUITests/LeoChatPasteTests \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/leo-ios.xcresult"

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leo-ios-xcresult
          retention-days: 14
          path: ${{ runner.temp }}/leo-ios.xcresult
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: rm -rf "$DERIVED_DATA" "$RUNNER_TEMP/leo-ios.xcresult"
