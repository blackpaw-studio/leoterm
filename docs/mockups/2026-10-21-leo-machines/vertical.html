<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leo Machines Vertical Meters</title>
<style>:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --page:#121214; --page-fg:#f2f2f4; --page-fg2:#9a9aa3; --card:#1b1b1f; --page-sep:rgba(255,255,255,.09);
  --stage:linear-gradient(135deg,#1b2745 0%,#33264f 55%,#1d3a40 100%);
  --win:#1e1e20; --sidebar:#2a2a2d; --content:#1e1e20; --toolbar:#2c2c2f;
  --label:rgba(255,255,255,.92); --l2:rgba(235,235,245,.6); --l3:rgba(235,235,245,.3); --l4:rgba(235,235,245,.16);
  --sep:rgba(255,255,255,.1); --win-border:rgba(255,255,255,.14); --field:rgba(255,255,255,.07); --field-bd:rgba(255,255,255,.12);
  --btn:rgba(255,255,255,.12); --btn-bd:rgba(255,255,255,.14); --track:rgba(255,255,255,.12);
  --accent:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --blue:#0a84ff; --indigo:#5e5ce6; --gray:#8e8e93;
  --meter-ok:rgba(235,235,245,.5);
  --menu:rgba(52,52,56,.96); --tip:#3b3b3f; --grouped:rgba(255,255,255,.055);
  --sel:#0a5fd0; --shadow:0 0 0 .5px var(--win-border),0 24px 64px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.3);
  /* iOS */
  --ibg:#000; --icell:#1c1c1e; --isep:rgba(84,84,88,.6); --ilabel:#fff; --ilabel2:rgba(235,235,245,.6); --ilabel3:rgba(235,235,245,.3);
  --itint:#0a84ff; --itrack:rgba(120,120,128,.32); --ibar:rgba(25,25,27,.86); --ibezel:#2a2a2d; --ibezel2:#0b0b0c;
}
:root[data-theme="light"]{
  --page:#f4f4f6; --page-fg:#1c1c1e; --page-fg2:#6c6c72; --card:#fff; --page-sep:rgba(0,0,0,.09);
  --stage:linear-gradient(135deg,#cfd9f2 0%,#e2d5f0 55%,#cfe8e6 100%);
  --win:#fff; --sidebar:#e8e8ea; --content:#fff; --toolbar:#ececee;
  --label:rgba(0,0,0,.85); --l2:rgba(60,60,67,.62); --l3:rgba(60,60,67,.36); --l4:rgba(60,60,67,.18);
  --sep:rgba(0,0,0,.1); --win-border:rgba(0,0,0,.16); --field:#fff; --field-bd:rgba(0,0,0,.14);
  --btn:#fff; --btn-bd:rgba(0,0,0,.16); --track:rgba(0,0,0,.1);
  --accent:#007aff; --green:#28cd41; --orange:#ff9500; --red:#ff3b30; --blue:#007aff; --indigo:#5856d6; --gray:#8e8e93;
  --meter-ok:rgba(60,60,67,.5);
  --menu:rgba(246,246,248,.97); --tip:#f7f4e3; --grouped:rgba(0,0,0,.04);
  --sel:#0a63d8; --shadow:0 0 0 .5px var(--win-border),0 22px 54px rgba(30,30,60,.25),0 2px 8px rgba(0,0,0,.12);
  --ibg:#f2f2f7; --icell:#fff; --isep:rgba(60,60,67,.29); --ilabel:#000; --ilabel2:rgba(60,60,67,.6); --ilabel3:rgba(60,60,67,.3);
  --itint:#007aff; --itrack:rgba(120,120,128,.2); --ibar:rgba(249,249,249,.9); --ibezel:#d9d9de; --ibezel2:#f5f5f7;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--page-fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
code{font-family:var(--mono);font-size:.9em;background:var(--page-sep);padding:1px 6px;border-radius:5px}
.ic{display:block;flex:none}

/* ───── page chrome ───── */
.top{max-width:1180px;margin:0 auto;padding:36px 28px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.top p{color:var(--page-fg2);margin-top:4px}
#theme{font:500 13px var(--font);color:var(--page-fg);background:var(--card);border:1px solid var(--page-sep);border-radius:8px;padding:7px 14px;cursor:pointer}
#theme:hover{border-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:12px 28px 80px;display:flex;flex-direction:column;gap:44px}
.panel{background:var(--card);border:1px solid var(--page-sep);border-radius:18px;overflow:hidden}
.plabel{display:flex;gap:14px;align-items:center;padding:18px 22px}
.pnum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.plabel h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
.plabel p{color:var(--page-fg2);font-size:13px}
.stage{background:var(--stage);padding:40px 36px 44px;display:flex;justify-content:center}
.split{display:flex;gap:28px;align-items:flex-start;justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px;align-items:center}
.cap{color:rgba(255,255,255,.85);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.35);align-self:flex-start;margin:6px 0 0 6px}
:root[data-theme="light"] .cap{color:rgba(0,0,0,.6);text-shadow:none}
.notes{width:290px;flex:none;background:rgba(18,18,22,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 18px;color:#eee;font-size:12.5px}
:root[data-theme="light"] .notes{background:rgba(255,255,255,.7);color:#222;border-color:rgba(0,0,0,.08)}
.notes.slim{width:232px}
.notes h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.6;margin:14px 0 8px}
.notes h4:first-child{margin-top:0}
.notes dt{font-weight:600;display:flex;align-items:center;gap:6px;margin-top:8px}
.notes dd{opacity:.78;margin-top:2px;line-height:1.4}
.notes p{opacity:.78;line-height:1.45}
.notes .dots{display:flex;flex-wrap:wrap;gap:6px 14px}.notes .dots span{display:flex;align-items:center;gap:6px;opacity:.85}
.lg{display:flex;align-items:center;gap:12px;margin:8px 0}
.lg .meter{width:150px}.lr{opacity:.7;font-size:12px}

/* ───── macOS window ───── */
.win{position:relative;display:flex;background:var(--win);border-radius:12px;box-shadow:var(--shadow);color:var(--label);font-size:13px;line-height:1.25;overflow:visible;flex:none}
.lights{position:absolute;left:14px;top:14px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:50%;display:block;border:.5px solid rgba(0,0,0,.18)}
.lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .g{background:#28c840}
.sidebar{width:290px;background:var(--sidebar);border-radius:12px 0 0 12px;display:flex;flex-direction:column;position:relative;flex:none;border-right:.5px solid var(--sep)}
.sbhead{margin-top:44px;padding:0 14px 0 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;height:26px}
.sbhead .plus{color:var(--l2)}
.search{margin:10px 12px 6px;height:26px;border-radius:7px;background:var(--field);border:.5px solid var(--field-bd);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--l3)}
.sblist{padding:2px 0 12px;overflow:hidden}
.content{flex:1;background:var(--content);border-radius:0 12px 12px 0;min-width:0}

/* machine header */
.mh{padding:11px 12px 5px 9px;position:relative}
.sblist>.mh:first-child{padding-top:6px}
.mh .l1{display:flex;align-items:center;gap:6px;height:18px}
.chev{color:var(--l2);width:10px;height:10px;transition:none}
.chev.open{transform:rotate(90deg)}
.mn{font-weight:650;font-size:13px;letter-spacing:-.005em}
.ms{font-size:11px;color:var(--l3);white-space:nowrap}
.sp{flex:1}
.cnt{font-size:11px;color:var(--l3);font-variant-numeric:tabular-nums}
.mh.dim .mn,.mh.dim .ms,.mh.dim .chev{opacity:.5}
.mh.hover::after,.mh.ctx::after{content:"";position:absolute;inset:3px 6px 2px;border-radius:6px;background:rgba(255,255,255,.04);pointer-events:none}
:root[data-theme="light"] .mh.hover::after,:root[data-theme="light"] .mh.ctx::after{background:rgba(0,0,0,.035)}
.mh.hover::after{display:none}
.mh.ctx::after{background:rgba(255,255,255,.08)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;display:inline-block;box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 22%,transparent)}
.dot.failed{background:var(--red);box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 22%,transparent)}
.dot.connecting{background:var(--orange);box-shadow:0 0 0 2px color-mix(in srgb,var(--orange) 22%,transparent)}
.dot.disabled{background:transparent;border:1.5px solid var(--l3);box-shadow:none}

/* meters */
.meters{display:grid;grid-template-columns:.7fr 1.05fr 1.3fr;gap:6px;margin:6px 0 2px 28px}
.meter .mt{display:flex;gap:4px;align-items:baseline;white-space:nowrap;margin-bottom:3px}
.ml{font-size:9px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--l3)}
.mv{font-size:10.5px;color:var(--l2);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bar{height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--meter-ok)}
.meter.warn .bar i{background:var(--orange)}.meter.crit .bar i{background:var(--red)}
.meter.warn .mv{color:var(--orange);font-weight:600}.meter.crit .mv{color:var(--red);font-weight:600}
.meter.warn .ml{color:var(--orange)}.meter.crit .ml{color:var(--red)}

/* agent rows */
.row{display:flex;gap:6px;margin:0 6px;padding:4px 8px 4px 14px;border-radius:6px}
.row.sel{background:var(--sel);color:#fff}
.sym{width:16px;flex:none;display:flex;justify-content:center;padding-top:1px;height:16px;align-items:center}
.sym.orange{color:var(--orange)}.sym.blue{color:var(--blue)}.sym.green{color:var(--green)}.sym.red{color:var(--red)}.sym.t3{color:var(--l3)}
.row.sel .sym{color:#fff}
.spin .ic{animation:none}
.rt{flex:1;min-width:0}
.nl{display:flex;align-items:center;justify-content:space-between;height:16px;gap:6px}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:10px;color:var(--l3);font-variant-numeric:tabular-nums}
.dl{font-size:10px;height:13px;margin-top:2px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl.orange{color:var(--orange)}.dl.red{color:var(--red)}
.row.sel .tm,.row.sel .dl{color:rgba(255,255,255,.78)}
.fail{margin:2px 14px 4px 29px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--red) 11%,transparent);border:.5px solid color-mix(in srgb,var(--red) 32%,transparent)}
.ft{font-size:11px;font-weight:650;color:var(--red)}
.fr{font-size:10.5px;color:var(--l2);margin-top:2px;line-height:1.3;word-break:break-word}
.fa{display:flex;align-items:center;gap:8px;margin-top:7px}
.retry{font-size:10px;color:var(--l3)}

/* buttons */
.btn{font:13px var(--font);color:var(--label);background:var(--btn);border:.5px solid var(--btn-bd);border-radius:6px;padding:2px 11px;height:22px;box-shadow:0 .5px 1px rgba(0,0,0,.2);cursor:default;white-space:nowrap}
.btn.sm{font-size:11px;height:19px;padding:0 9px;border-radius:5px}
.btn.prim{background:var(--accent);border-color:transparent;color:#fff}

/* tooltip + menu */
.tip{position:absolute;z-index:20;background:var(--tip);color:var(--label);border:.5px solid var(--win-border);border-radius:6px;padding:6px 9px;font-size:11px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.35);white-space:nowrap}
.tip b{font-weight:650}.tsub{color:var(--l2);margin-top:2px;font-size:10.5px}

/* ───── vertical-meter variants ───── */
.top{max-width:1180px}
.opts{display:flex;gap:28px;align-items:stretch;justify-content:center}
.opt{display:flex;flex-direction:column;gap:14px;width:290px}
.ocap{background:rgba(18,18,22,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;color:#eee;display:flex;gap:11px;align-items:flex-start}
:root[data-theme="light"] .ocap{background:rgba(255,255,255,.72);color:#222;border-color:rgba(0,0,0,.08)}
.ocap .pnum{width:26px;height:26px;font-size:13px}
.ocap h3{font-size:14px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.ocap p{font-size:12px;opacity:.74;margin-top:2px;line-height:1.4}
.win.solo{flex:1}
.win.solo .sidebar{border-radius:12px;border-right:0;width:100%}
.win.solo .sblist{flex:1}
.legend{display:flex;gap:26px;align-items:center;justify-content:center;margin-top:26px;color:rgba(255,255,255,.88);font-size:12px}
:root[data-theme="light"] .legend{color:rgba(0,0,0,.65)}
.legend span{display:flex;align-items:center;gap:8px}
.legend .vb{height:18px}

/* vertical bar primitive */
:root{--vtrack:rgba(255,255,255,.17);--vfill:rgba(235,235,245,.74)}
:root[data-theme="light"]{--vtrack:rgba(0,0,0,.13);--vfill:rgba(60,60,67,.62)}
.vb{width:4px;height:17px;border-radius:2px;background:var(--vtrack);display:flex;align-items:flex-end;flex:none;position:relative}
.vb i{display:block;width:100%;border-radius:2px;background:var(--vfill);min-height:2px}
.vb.warn i{background:var(--orange)}.vb.crit i{background:var(--red)}
.vb.nodata{background:transparent;box-shadow:inset 0 0 0 1px var(--l4)}
.vb.nodata i{display:none}
.vb.hot{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--orange) 45%,transparent)}
.vb.hot.crit{box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 30%,transparent)}
.mh .l1 .cnt{min-width:8px;text-align:right}

/* A — compact cluster */
.cluster{display:flex;gap:2.5px;align-items:flex-end;margin-right:9px}
.mh.dim .cluster{display:none}

/* B — labeled columns */
.vcols{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0 2px 28px}
.vcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.vcol .vb{width:7px;height:16px;border-radius:2.5px}
.vcol .vb i{border-radius:2.5px}
.vcol .vt{display:flex;gap:4px;align-items:baseline;white-space:nowrap;line-height:1}
.vcol.warn .mv,.vcol.crit .mv{font-weight:600}
.vcol.warn .mv,.vcol.warn .ml{color:var(--orange)}
.vcol.crit .mv,.vcol.crit .ml{color:var(--red)}
.vcol.nodata .mv{color:var(--l3)}

/* C — status glyph replaces the dot */
.glyph{display:flex;flex-direction:column;gap:2px;flex:none;width:14px;align-items:center}
.gbars{display:flex;gap:1.5px;align-items:flex-end;height:13px}
.gbars .vb{width:3px;height:13px;border-radius:1.5px}
.gbars .vb i{border-radius:1.5px}
.gbars .vb.nodata{box-shadow:inset 0 0 0 .75px var(--l3)}
.gbase{height:2px;width:100%;border-radius:1px;background:var(--green);box-shadow:0 0 4px color-mix(in srgb,var(--green) 55%,transparent)}
.gbase.failed{background:var(--red);box-shadow:0 0 4px color-mix(in srgb,var(--red) 55%,transparent)}
.gbase.connecting{background:var(--orange)}
.mh.dim .gbars{opacity:.4}
.mh .l1 .glyph{margin-right:1px}

/* tooltip anchored under a bar */
.mh .tip{top:28px;right:6px;z-index:30}
.mh .tip::before{content:"";position:absolute;top:-4px;right:var(--caret,24px);width:7px;height:7px;background:var(--tip);border-left:.5px solid var(--win-border);border-top:.5px solid var(--win-border);transform:rotate(45deg)}
</style>
</head>

<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 3L5.5 13.5h5.2L9.8 21l8-10.8h-5.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="6.5" rx="2"/><rect x="3" y="13.5" width="18" height="6.5" rx="2"/></g><circle cx="7" cy="7.25" r="1" fill="currentColor"/><circle cx="7" cy="16.75" r="1" fill="currentColor"/><path d="M11 7.25h6M11 16.75h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r=".6"/><circle cx="4.6" cy="12" r=".6"/><circle cx="4.6" cy="17.5" r=".6"/></g></symbol>
<symbol id="i-bubble" viewBox="0 0 24 24"><path d="M12 4.2c-4.7 0-8.3 3-8.3 6.9 0 2.1 1.1 4 2.8 5.2-.1 1.2-.6 2.2-1.4 3 1.8-.1 3.2-.8 4.2-1.7.8.2 1.7.3 2.7.3 4.7 0 8.3-3 8.3-6.8S16.700 4.200 12 4.200z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
<symbol id="i-signal" viewBox="0 0 16 16"><g fill="currentColor"><rect x="1.5" y="10" width="2.2" height="3.5" rx=".6"/><rect x="5" y="7.5" width="2.2" height="6" rx=".6"/><rect x="8.5" y="5" width="2.2" height="8.5" rx=".6"/><rect x="12" y="2.5" width="2.2" height="11" rx=".6"/></g></symbol>
<symbol id="i-wifi" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.6 6a9.5 9.5 0 0 1 12.800 0"/><path d="M3.800 8.500a6.300 6.300 0 0 1 8.400 0"/></g><circle cx="8" cy="11.800" r="1.400" fill="currentColor"/></symbol>
<symbol id="i-battery" viewBox="0 0 24 16"><rect x="1" y="3" width="19" height="10" rx="3" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="2.600" y="4.600" width="15.800" height="6.800" rx="1.800" fill="currentColor"/><path d="M21.500 6v4" stroke="currentColor" stroke-opacity=".45" stroke-width="1.500" stroke-linecap="round"/></symbol>
</defs></svg>
<header class="top">
  <div><h1>Leo Machines: vertical meters</h1><p>Three options for replacing the horizontal CPU, memory and disk bars. Same sidebar, same states, same thresholds. Static, no app code changed.</p></div>
  <button id="theme" type="button" aria-label="Toggle light and dark mode">Light mode</button>
</header>
<main>
<section class="panel" id="all">
  <div class="plabel"><span class="pnum">V</span><div><h2>Vertical meter options</h2><p>Dionysus memory is at 85% (amber). Hestia is offline. leo-vm runs a daemon too old for stats.</p></div></div>
  <div class="stage" style="flex-direction:column;align-items:center"><div class="opts" id="opts"></div>
  <div class="legend" id="legend"></div></div>
</section>
</main>
<script>
const LEVEL = pct => pct >= 90 ? "crit" : pct >= 80 ? "warn" : "ok";
const ic = (id, s) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true"><use href="#${id}"/></svg>`;
const row = (c, icon, name, tm, dl, dlc = "", sel = "", spin = "") =>
  `<div class="row ${sel}"><span class="sym ${c} ${spin}">${ic(icon, 14)}</span><div class="rt"><div class="nl"><span class="nm">${name}</span><span class="tm">${tm}</span></div>${dl ? `<div class="dl ${dlc}">${dl}</div>` : ""}</div></div>`;

const MACHINES = [
  { name: "This Mac", sub: "evans-mbp.local", dot: "ok", cnt: 3, stats: [
      { k: "cpu", l: "CPU", pct: 23, v: "23%", tip: "CPU · This Mac — 23% used" },
      { k: "mem", l: "Mem", pct: 29, v: "29%", tip: "Memory · This Mac — 18.4 GB of 64 GB used (29%)" },
      { k: "disk", l: "Disk", pct: 41, v: "41%", tip: "Disk · This Mac — 412 GB of 994 GB used (41%)" }],
    rows: [row("orange", "i-lock", "leoterm", "1m", "Run: git push origin feat/machines", "orange"),
           row("blue", "i-working", "web", "now", "Editing LeoSidebarView.swift", "", "", "spin"),
           row("t3", "i-moon", "scratch", "2h", "")] },
  { name: "Dionysus", sub: "", dot: "ok", cnt: 3, tipOn: "mem", stats: [
      { k: "cpu", l: "CPU", pct: 41, v: "41%", tip: "CPU · Dionysus — 41% used" },
      { k: "mem", l: "Mem", pct: 85, v: "85%", tip: "Memory · Dionysus — 27.2 GB of 32 GB used (85%)" },
      { k: "disk", l: "Disk", pct: 64, v: "64%", tip: "Disk · Dionysus — 640 GB of 1000 GB used (64%)" }],
    rows: [row("blue", "i-working", "web", "now", "Running swift test", "", "sel", "spin"),
           row("green", "i-check-circle", "plex-fix", "12m", "Fixed transcoder path, 3 files"),
           row("t3", "i-moon", "nomad-cleanup", "1d", "")] },
  { name: "Hestia", sub: "", dot: "failed", cnt: null, offline: true, collapsed: true, rows: [] },
  { name: "leo-vm", sub: "", dot: "ok", cnt: 2, nostats: true, rows: [
      row("blue", "i-working", "e2e-runner", "now", "Tart VM boot check", "", "", "spin"),
      row("red", "i-tri", "build-check", "6m", "xcodebuild exited with status 65", "red")] },
];
const FAIL = `<div class="fail"><div class="ft">Connection failed</div><div class="fr">ssh: connect to host hestia.lan port 22: Operation timed out</div><div class="fa"><button class="btn sm">Reconnect</button><span class="retry">Retrying in 42s</span></div></div>`;

const bar = (s, o = {}) => `<i class="vb ${o.nodata ? "nodata" : LEVEL(s.pct)} ${o.hot ? "hot" : ""}" title="${o.nodata ? "Stats unavailable" : s.tip}"><i style="height:${o.nodata ? 0 : s.pct}%"></i></i>`;
const NODATA = ["cpu", "mem", "disk"].map(k => ({ k, l: { cpu: "CPU", mem: "Mem", disk: "Disk" }[k] }));

const tip = m => {
  const s = m.stats.find(x => x.k === m.tipOn);
  const [head, body] = s.tip.split(" — ");
  return `<div class="tip" style="--caret:27px"><b>${head.split(" · ")[0]}</b> · ${m.name}<br>${body}<div class="tsub">Sampled 3 s ago · 20:41:07</div></div>`;
};

const VARIANTS = {
  A: { title: "Compact cluster", desc: "Three 4px bars on the header row, before the count. No text: numbers live in the tooltip.",
    header: m => m.stats
      ? `<span class="cluster">${m.stats.map(s => bar(s, { hot: m.tipOn === s.k })).join("")}</span>`
      : m.nostats ? `<span class="cluster">${NODATA.map(s => bar(s, { nodata: true })).join("")}</span>` : "",
    lead: m => `<span class="dot ${m.dot}"></span>`,
    extra: () => "", tip: true },
  B: { title: "Labeled columns", desc: "A second header line: three short bars, each with its label and percentage beneath.",
    header: () => "",
    lead: m => `<span class="dot ${m.dot}"></span>`,
    extra: m => m.stats ? `<div class="vcols">${m.stats.map(s => `<div class="vcol ${LEVEL(s.pct)}" title="${s.tip}">${bar(s)}<div class="vt"><span class="ml">${s.l}</span><span class="mv">${s.v}</span></div></div>`).join("")}</div>`
      : m.nostats ? `<div class="vcols">${NODATA.map(s => `<div class="vcol nodata" title="Stats unavailable">${bar(s, { nodata: true })}<div class="vt"><span class="ml">${s.l}</span><span class="mv">—</span></div></div>`).join("")}</div>` : "" },
  C: { title: "Status glyph", desc: "The dot becomes a 3-bar glyph. Its baseline is the connection dot, so state and load share one mark.",
    header: () => "",
    lead: m => `<span class="glyph"><span class="gbars">${(m.stats || NODATA).map(s => bar(s, { nodata: !m.stats })).join("")}</span><span class="gbase ${m.dot === "ok" ? "" : m.dot}"></span></span>`,
    extra: () => "" },
};

const section = (v, m) => {
  const open = !m.collapsed;
  const head = `<div class="mh ${m.offline ? "dim ctx" : ""} ${m.name === "Dionysus" ? "hover" : ""}"><div class="l1">${ic("i-chevron", 10).replace('class="ic"', `class="ic chev ${open ? "open" : ""}"`)}${v.lead(m)}<span class="mn">${m.name}</span>${m.sub ? `<span class="ms">${m.sub}</span>` : ""}<span class="sp"></span>${v.header(m)}${m.cnt != null ? `<span class="cnt">${m.cnt}</span>` : ""}</div>${v.extra(m)}${v.tip && m.tipOn ? tip(m) : ""}</div>`;
  return head + (m.offline ? FAIL : m.rows.join(""));
};

const sidebar = v => `<div class="win solo"><div class="sidebar">
  <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
  <div class="sbhead"><span>Agents</span><span class="plus">${ic("i-plus", 14)}</span></div>
  <div class="search">${ic("i-search", 12)}<span>Search agents</span></div>
  <div class="sblist">${MACHINES.map(m => section(v, m)).join("")}</div></div></div>`;

document.getElementById("opts").innerHTML = Object.entries(VARIANTS).map(([id, v]) =>
  `<div class="opt" id="opt-${id.toLowerCase()}"><div class="ocap"><span class="pnum">${id}</span><div><h3>${v.title}</h3><p>${v.desc}</p></div></div>${sidebar(v)}</div>`).join("");

document.getElementById("legend").innerHTML = [["Normal", 42, "below 80%"], ["Warning", 85, "80% or more"], ["Critical", 94, "90% or more"]]
  .map(([n, p, r]) => `<span>${bar({ pct: p, tip: n })}<b>${n}</b> ${r}</span>`).join("");

const btn = document.getElementById("theme");
const setTheme = t => { document.documentElement.dataset.theme = t; btn.textContent = t === "dark" ? "Light mode" : "Dark mode"; };
btn.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
</script>
</body>
</html>
